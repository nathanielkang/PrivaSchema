# Phase B: same-engine PrivBayes win (required before ScholarOne).
# Primary metric: query_accuracy.query_error_cross_table
# Allocator must beat equal_split by more than seed wobble.

privacy:
  epsilon_total: 1.0
  delta: 1.0e-5
  epsilon_min_per_table: 0.01

synthesis:
  method: noisy_marginals
  max_parents_bn: 3
  noise_type: laplace
  num_bins: 32
  fk_hist_frac: 0.2

allocator:
  method: lp_rdp
  solver: scipy
  query_weight_decay: 0.9
  workload_mode: paper   # FK chains; log-volume weights; join queries x2

enforcer:
  method: optimal_transport
  max_repair_iterations: 100
  ot_reg: 0.01

evaluation:
  num_queries: 100
  query_types:
    - 1way
    - 2way
    - 3way
    - cross_table
  ml_test_fraction: 0.2
  ml_model: lightgbm

baselines:
  methods:
    - independent
    - equal_split
    - privaschema
  non_private_methods: []
  skip_on_missing: true
  allow_named_fallbacks: false
  allow_aim_bootstrap: false

experiment:
  epsilons: [0.5, 1.0, 5.0]
  num_runs: 3
  seed: 42
  datasets:
    - berka
    - rossmann
    - imdb
    - tpch
    - university
    - walmart
    - synthetic_star
