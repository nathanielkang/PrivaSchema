# TIFS missing cells only: F / U / C / P. P skips unless extras/PrivLava is real.

privacy:
  epsilon_total: 1.0
  delta: 1.0e-5
  epsilon_min_per_table: 0.01

synthesis:
  method: noisy_marginals
  max_parents_bn: 3
  noise_type: laplace
  num_bins: 32
  fk_rdp_share: 0.25
  fk_hist_frac: 0.25
  fk_sampling: degree

allocator:
  method: lp_rdp
  solver: scipy
  query_weight_decay: 0.9
  workload_mode: paper

enforcer:
  method: greedy
  max_repair_iterations: 50
  ot_reg: 0.01

evaluation:
  num_queries: 40
  query_types:
    - 1way
    - 2way
    - cross_table
  ml_test_fraction: 0.2
  ml_model: lightgbm
  join_clip_mult: 10.0
  membership_inference: true

baselines:
  methods:
    - F
    - U
    - C
    - P
  non_private_methods: []
  skip_on_missing: true
  allow_named_fallbacks: false
  allow_aim_bootstrap: false
  privlava_path: extras/PrivLava

experiment:
  epsilons: [1.0]
  num_runs: 3
  seed: 42
  datasets:
    - berka
    - imdb
    - tpch
