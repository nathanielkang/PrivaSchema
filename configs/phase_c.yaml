# Phase C: integrity-preserving DP vs AIM+Repair (no fake L/P/G names).
# Primary: query_accuracy.query_error_cross_table among FK=1.00 methods.

privacy:
  epsilon_total: 1.0
  delta: 1.0e-5
  epsilon_min_per_table: 0.01

synthesis:
  method: noisy_marginals
  max_parents_bn: 3
  noise_type: laplace
  num_bins: 32
  fk_hist_frac: 0.2

allocator:
  method: lp_rdp
  solver: scipy
  query_weight_decay: 0.9
  workload_mode: paper

enforcer:
  method: optimal_transport
  max_repair_iterations: 100
  ot_reg: 0.01

evaluation:
  num_queries: 100
  query_types:
    - 1way
    - 2way
    - 3way
    - cross_table
  ml_test_fraction: 0.2
  ml_model: lightgbm

baselines:
  methods:
    - independent
    - equal_split
    - privaschema
    - aim_repair
    - privaschema_aim
  non_private_methods: []
  skip_on_missing: true
  allow_named_fallbacks: false
  allow_aim_bootstrap: false
  aim_split: sqrt
  aim_preprocessor_frac: 0.2

experiment:
  epsilons: [1.0]
  num_runs: 3
  seed: 42
  datasets:
    - berka
    - rossmann
    - imdb
    - tpch
    - university
    - walmart
    - synthetic_star
