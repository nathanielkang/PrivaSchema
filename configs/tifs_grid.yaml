# TIFS ε sweep. Cells are measured only after a local run writes CSV/JSON.
# Do not paste ledger estimates into this file.

privacy:
  epsilon_total: 1.0
  delta: 1.0e-5
  epsilon_min_per_table: 0.01

synthesis:
  method: noisy_marginals
  max_parents_bn: 3
  noise_type: laplace
  num_bins: 32
  fk_rdp_share: 0.25          # ε_fk² = 0.25 ε_i², ε_synth² = 0.75 ε_i²
  fk_hist_frac: 0.25
  fk_sampling: degree         # degree | uniform

allocator:
  method: lp_rdp
  solver: scipy
  query_weight_decay: 0.9
  workload_mode: paper

enforcer:
  method: optimal_transport
  max_repair_iterations: 100
  ot_reg: 0.01

evaluation:
  num_queries: 100
  query_types:
    - 1way
    - 2way
    - 3way
    - cross_table
  ml_test_fraction: 0.2
  ml_model: lightgbm
  join_clip_mult: 10.0
  membership_inference: true

baselines:
  methods:
    - privaschema
    - equal_split
    - independent
    - F
    - U
    - C
    - P
  non_private_methods: []
  skip_on_missing: true
  allow_named_fallbacks: false
  allow_aim_bootstrap: false
  aim_split: sqrt
  privlava_path: extras/PrivLava

experiment:
  epsilons: [0.1, 0.5, 1.0, 2.0, 4.0]
  num_runs: 3
  seed: 42
  datasets:
    - berka
    - imdb
    - tpch
    - synthetic_star
    - university
    - rossmann
    - walmart
